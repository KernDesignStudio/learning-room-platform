name: Publish Learning Room
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          API_ORIGIN: ${{ vars.LEARNING_ROOM_API_ORIGIN }}
          BRAND_FONT: ${{ vars.LEARNING_ROOM_BRAND_FONT }}
      - uses: actions/configure-pages@v5
        if: vars.ENABLE_PAGES_DEPLOY == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_PAGES_DEPLOY == 'true'
        with:
          path: dist
  deploy:
    needs: verify-and-build
    if: vars.ENABLE_PAGES_DEPLOY == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
