services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: '8788'
      DB_PATH: /app/.local/learning-room.sqlite
      SERVE_STATIC: 'false'
      ALLOWED_ORIGINS: https://orbiting0314.github.io
      RELEASE_SHA: ${SOURCE_COMMIT:-unknown}
    expose:
      - '8788'
    volumes:
      - learning-room-data:/app/.local
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:8788/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  learning-room-data:
